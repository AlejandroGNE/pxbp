[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pxbp"
version = "0.2.0"
description = "On-demand PLEXOS Cloud queries and Bokeh pivots"
requires-python = ">=3.10"
dependencies = [
  "bokeh>=3.4,<4",
  "pandas>=2.2,<3",
  "plexos-query @ git+https://github.com/AlejandroGNE/plexos-query.git@39495be3e164129c9aae4077f40175c448c918bd",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pxbp = "pxbp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
